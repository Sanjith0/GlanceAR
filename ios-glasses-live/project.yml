name: GlanceGlassesLive
options:
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.4"
packages:
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    GLANCE_META_APP_ID: "0"
    GLANCE_META_CLIENT_TOKEN: ""
    # The live Glance web app this shell opens (must be https).
    GLANCE_WEB_URL: "https://glancear.vercel.app"
targets:
  GlanceGlassesLive:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Web/glassesCameraShim.js
        buildPhase: resources
    entitlements:
      path: GlanceGlassesLive.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glancear.glasses.live
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: Info.plist
    dependencies:
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
