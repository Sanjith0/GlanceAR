name: GlanceGlasses
options:
  deploymentTarget:
    iOS: "17.2"
  xcodeVersion: "26.4"
packages:
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    GLANCE_META_APP_ID: "0"
    GLANCE_META_CLIENT_TOKEN: ""
targets:
  GlanceGlasses:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../modules/glance-capture/ios/HandPoseGeometry.swift
      - path: ../modules/glance-capture/ios/HandSignalDetector.swift
      - path: ../modules/glance-audio/ios/LeaseAudioRecorder.swift
      - path: ../modules/glance-audio/ios/LeaseDeadline.swift
    entitlements:
      path: GlanceGlasses.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glancear.glasses
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: Info.plist
    dependencies:
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
  GlanceGlassesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../modules/glance-capture/ios/Tests/HandPoseGeometryTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glancear.glasses.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GlanceGlasses
schemes:
  GlanceGlasses:
    build:
      targets:
        GlanceGlasses: all
        GlanceGlassesTests: [test]
    test:
      targets: [GlanceGlassesTests]
